[project]
name = "tools-hub"
version = "1.0.0"
description = "One window for every personal tool: open it, see its status, follow its backlog"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "PySide6>=6.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
